<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenPay Congo — STK Push</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #00c96b;
      --green2:  #00a855;
      --red:     #ff4d6d;
      --yellow:  #ffd166;
      --blue:    #118cf7;
      --purple:  #845ef7;
      --dark:    #0d0f1a;
      --card:    #161928;
      --border:  #252a3d;
      --text:    #e8eaf6;
      --muted:   #7b82a8;
      --radius:  14px;
    }

    body {
      min-height: 100vh;
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    /* ── Animated gradient background ──────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,201,107,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(132,94,247,.15) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Toast stack ────────────────────────────────────── */
    #toasts {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      width: calc(100% - 40px);
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      animation: slideIn .35s cubic-bezier(.22,1,.36,1) both;
      cursor: pointer;
      border-left: 4px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .toast::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: currentColor;
      opacity: .35;
      animation: toastTimer 4s linear forwards;
    }
    .toast.success { background: rgba(0,201,107,.15); border-color: var(--green);  color: #a6f5ce; }
    .toast.error   { background: rgba(255,77,109,.15); border-color: var(--red);    color: #ffb3c1; }
    .toast.info    { background: rgba(17,140,247,.15); border-color: var(--blue);   color: #93d5ff; }
    .toast.warning { background: rgba(255,209,102,.15);border-color: var(--yellow); color: #ffe599; }

    .toast-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .toast-body { flex: 1; }
    .toast-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .toast-msg   { opacity: .85; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(120%); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      to   { opacity: 0; transform: translateX(120%); }
    }
    @keyframes toastTimer {
      from { width: 100%; }
      to   { width: 0%; }
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 36px;
      margin-top: 16px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(0,201,107,.4);
    }
    .logo-name {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title span { color: var(--muted); font-size: 13px; font-weight: 400; }

    /* ── Form ───────────────────────────────────────────── */
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    label .req { color: var(--red); margin-left: 3px; }

    input, select {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,201,107,.15);
    }
    select option { background: #1e2235; }

    .field-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Provider tabs */
    .provider-tabs {
      display: flex;
      gap: 8px;
    }
    .provider-tab {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .provider-tab.active {
      border-color: var(--green);
      background: rgba(0,201,107,.12);
      color: var(--green);
    }
    .provider-tab.disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .provider-tab .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .maintenance-badge {
      font-size: 10px;
      background: rgba(255,209,102,.15);
      color: var(--yellow);
      border-radius: 4px;
      padding: 2px 5px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    /* ── Submit button ──────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #fff;
      letter-spacing: .03em;
      box-shadow: 0 6px 24px rgba(0,201,107,.3);
      transition: transform .15s, box-shadow .15s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(0,201,107,.4);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Spinner ────────────────────────────────────────── */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Status panel ───────────────────────────────────── */
    #status-panel {
      margin-top: 24px;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .status-step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      animation: fadeUp .4s ease both;
    }
    .status-step:last-child { border-bottom: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .step-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .step-icon.pending  { background: rgba(255,209,102,.15); color: var(--yellow); }
    .step-icon.loading  { background: rgba(17,140,247,.15);  color: var(--blue); }
    .step-icon.success  { background: rgba(0,201,107,.15);   color: var(--green); }
    .step-icon.error    { background: rgba(255,77,109,.15);   color: var(--red); }

    .step-text { flex: 1; }
    .step-label { font-size: 14px; font-weight: 600; }
    .step-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Error banner (top of card) ─────────────────────── */
    #error-banner {
      display: none;
      background: rgba(255,77,109,.12);
      border: 1px solid rgba(255,77,109,.3);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #ffb3c1;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: fadeUp .35s ease both;
    }
    #error-banner.hidden { display: none !important; }
    #error-banner .err-icon { font-size: 18px; flex-shrink: 0; }
    #error-banner .err-close {
      margin-left: auto;
      cursor: pointer;
      opacity: .6;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    #error-banner .err-close:hover { opacity: 1; }

    /* ── Success result card ─────────────────────────────── */
    #result-card {
      display: none;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0,201,107,.25);
      background: rgba(0,201,107,.07);
      padding: 20px;
      animation: fadeUp .4s ease both;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 13px;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row .r-key   { color: var(--muted); }
    .result-row .r-val   { font-weight: 600; color: var(--text); font-family: monospace; font-size: 12px; }
    .result-row .r-val.green { color: var(--green); }
    .result-row .r-val.red   { color: var(--red); }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 36px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    footer a { color: var(--green); text-decoration: none; }
  </style>
</head>
<body>

<!-- Toast container -->
<div id="toasts"></div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">💳</div>
    <div class="logo-name">OpenPay Congo</div>
  </div>
  <p>Mobile Money STK Push — République du Congo</p>
</header>

<!-- Main card -->
<div class="card">
  <div class="card-title">
    🚀 Initiate Payment <span>STK Push</span>
  </div>

  <!-- Error banner (shown above form on API errors) -->
  <div id="error-banner" class="hidden">
    <span class="err-icon">⚠️</span>
    <div>
      <strong id="error-title">Error</strong>
      <div id="error-msg" style="margin-top:4px;opacity:.85;"></div>
    </div>
    <span class="err-close" onclick="hideError()">✕</span>
  </div>

  <form id="stk-form" onsubmit="submitSTK(event)" novalidate>

    <!-- Amount -->
    <div class="field">
      <label>Amount (XAF) <span class="req">*</span></label>
      <input
        type="number"
        id="amount"
        placeholder="e.g. 5000"
        min="1"
        required
      />
    </div>

    <!-- Phone -->
    <div class="field">
      <label>Phone Number <span class="req">*</span></label>
      <input
        type="text"
        id="phone"
        placeholder="242XXXXXXXXX"
        maxlength="12"
        required
      />
      <div class="field-hint">Format: 242 followed by 9 digits</div>
    </div>

    <!-- Provider -->
    <div class="field">
      <label>Mobile Operator <span class="req">*</span></label>
      <div class="provider-tabs">
        <button type="button" class="provider-tab active" id="tab-mtn" onclick="selectProvider('MTN')">
          <span class="dot"></span> MTN
        </button>
        <button type="button" class="provider-tab disabled" id="tab-airtel" title="AIRTEL is under maintenance" disabled>
          <span class="dot"></span> AIRTEL
          <span class="maintenance-badge">MAINTENANCE</span>
        </button>
      </div>
      <div class="field-hint">⚠️ AIRTEL is currently unavailable due to maintenance</div>
    </div>

    <!-- Optional: External ID -->
    <div class="field">
      <label>Customer Reference <span style="color:var(--muted);font-size:11px;text-transform:none">(optional)</span></label>
      <input type="text" id="ext-id" placeholder="e.g. order-789" />
    </div>

    <button class="btn" type="submit" id="submit-btn">
      <span id="btn-label">Send STK Push</span>
    </button>
  </form>

  <!-- Status steps panel -->
  <div id="status-panel"></div>

  <!-- Result details card -->
  <div id="result-card"></div>
</div>

<footer>
  Powered by <a href="https://openpay-cg.com" target="_blank">OpenPay</a> —
  Secure mobile payments for Congo
</footer>

<script>
  /* ── State ────────────────────────────────────────────── */
  let selectedProvider = 'MTN';

  /* ── Provider selection ───────────────────────────────── */
  function selectProvider(p) {
    if (p === 'AIRTEL') return; // maintenance
    selectedProvider = p;
    document.querySelectorAll('.provider-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + p.toLowerCase()).classList.add('active');
  }

  /* ── Toast system ─────────────────────────────────────── */
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  const titles = { success: 'Success', error: 'Error', info: 'Info', warning: 'Warning' };

  function toast(type, msg, detail = '') {
    const container = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
      <span class="toast-icon">${icons[type]}</span>
      <div class="toast-body">
        <div class="toast-title">${titles[type]}</div>
        <div class="toast-msg">${msg}${detail ? `<br><small style="opacity:.7">${detail}</small>` : ''}</div>
      </div>`;
    el.onclick = () => dismissToast(el);
    container.appendChild(el);
    setTimeout(() => dismissToast(el), 4500);
  }

  function dismissToast(el) {
    el.style.animation = 'slideOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }

  /* ── Error banner ─────────────────────────────────────── */
  function showError(title, msg) {
    const banner = document.getElementById('error-banner');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent = msg;
    banner.classList.remove('hidden');
    banner.style.display = 'flex';
    banner.style.animation = 'none';
    void banner.offsetWidth; // reflow
    banner.style.animation = 'fadeUp .35s ease both';
  }

  function hideError() {
    const banner = document.getElementById('error-banner');
    banner.classList.add('hidden');
  }

  /* ── Status panel ─────────────────────────────────────── */
  function clearPanel() {
    const p = document.getElementById('status-panel');
    p.innerHTML = '';
    p.style.display = 'none';
    document.getElementById('result-card').style.display = 'none';
  }

  function addStep(id, iconClass, icon, label, sub = '') {
    const p = document.getElementById('status-panel');
    p.style.display = 'block';
    p.style.background = 'var(--card)';
    p.style.border = '1px solid var(--border)';

    const el = document.createElement('div');
    el.className = 'status-step';
    el.id = 'step-' + id;
    el.innerHTML = `
      <div class="step-icon ${iconClass}" id="step-icon-${id}">${icon}</div>
      <div class="step-text">
        <div class="step-label" id="step-label-${id}">${label}</div>
        <div class="step-sub" id="step-sub-${id}">${sub}</div>
      </div>`;
    p.appendChild(el);
  }

  function updateStep(id, iconClass, icon, label, sub = '') {
    const ic = document.getElementById('step-icon-' + id);
    if (ic) {
      ic.className = `step-icon ${iconClass}`;
      ic.innerHTML = icon;
    }
    const lb = document.getElementById('step-label-' + id);
    if (lb) lb.textContent = label;
    const sb = document.getElementById('step-sub-' + id);
    if (sb) sb.textContent = sub;
  }

  /* ── Result card ──────────────────────────────────────── */
  function showResult(data) {
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    rc.innerHTML = `
      <div style="font-size:13px;font-weight:700;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:6px">
        ✅ Transaction Details
      </div>
      ${row('Reference', data.reference, '')}
      ${row('Amount', data.amount + ' ' + (data.currency || 'XAF'), '')}
      ${row('Phone', data.paymentPhoneNumber || data.payment_phone_number, '')}
      ${row('Provider', data.provider, '')}
      ${row('Status', data.status, data.status === 'success' ? 'green' : '')}
      ${data.message || data.Message ? row('Message', data.message || data.Message, '') : ''}
      ${data.createdAt ? row('Time', new Date(data.createdAt).toLocaleString(), '') : ''}
    `;
  }

  function row(key, val, cls) {
    return `<div class="result-row">
      <span class="r-key">${key}</span>
      <span class="r-val ${cls}">${val ?? '—'}</span>
    </div>`;
  }

  /* ── Button state helpers ─────────────────────────────── */
  function setLoading(loading) {
    const btn = document.getElementById('submit-btn');
    const lbl = document.getElementById('btn-label');
    btn.disabled = loading;
    if (loading) {
      lbl.textContent = 'Processing…';
      btn.innerHTML = `<div class="spinner"></div><span id="btn-label">Processing…</span>`;
    } else {
      btn.innerHTML = `<span id="btn-label">Send STK Push</span>`;
    }
  }

  /* ── Validation ───────────────────────────────────────── */
  function validate(amount, phone, provider) {
    if (!amount || isNaN(amount) || Number(amount) <= 0)
      return 'Amount must be a positive number.';
    if (!/^242\d{9}$/.test(phone))
      return 'Phone must be in Congo format: 242 followed by 9 digits (12 total).';
    if (!['MTN', 'AIRTEL'].includes(provider))
      return 'Please select a valid provider.';
    return null;
  }

  /* ── Main submit ──────────────────────────────────────── */
  async function submitSTK(e) {
    e.preventDefault();
    hideError();
    clearPanel();

    const amount   = document.getElementById('amount').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const provider = selectedProvider;
    const extId    = document.getElementById('ext-id').value.trim();

    /* Client-side validation */
    const validErr = validate(amount, phone, provider);
    if (validErr) {
      showError('Validation Error', validErr);
      toast('error', validErr);
      return;
    }

    setLoading(true);

    /* Step 1: Initiating */
    addStep('init', 'loading', '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div>',
      'Initiating STK Push…', `Sending payment request for ${Number(amount).toLocaleString()} XAF`);
    toast('info', 'STK Push initiated', `Sending to ${phone} via ${provider}`);

    const body = { amount: Number(amount), phone, provider };
    if (extId) body.customer_external_id = extId;

    let result;
    try {
      const response = await fetch('https://backend.onrender.com/stk-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      result = await response.json();

      /* HTTP-level error (400, 401, 500, etc.) */
      if (!response.ok) {
        const errMsg = result?.error || `Server responded with HTTP ${response.status}`;
        throw { userMessage: errMsg, status: response.status };
      }

    } catch (err) {
      setLoading(false);

      /* Network failure (no connection to server) */
      if (err instanceof TypeError) {
        updateStep('init', 'error', '❌', 'Connection failed', 'Could not reach the server');
        showError('Network Error', 'Unable to connect to the server. Is it running on port 3000?');
        toast('error', 'Network error', 'Cannot reach the server');
        return;
      }

      /* API / HTTP error with message */
      const msg = err.userMessage || 'An unexpected error occurred.';
      updateStep('init', 'error', '❌', 'Request failed', msg);
      showError(`API Error (${err.status || ''})`, msg);
      toast('error', 'STK Push failed', msg);
      return;
    }

    /* ── Result handling ──────────────────────────────── */

    if (!result.success) {
      /* Server returned success:false with a message */
      const msg = result.error || result.message || 'Transaction did not complete.';
      const status = result.data?.status;

      updateStep('init', 'error', '❌',
        status ? `Transaction ${status}` : 'STK Push failed', msg);

      showError('Payment Failed', msg);
      toast('error', 'Payment failed', msg);
      setLoading(false);

      if (result.data) showResult(result.data);
      return;
    }

    /* ── SUCCESS ──────────────────────────────────────── */
    updateStep('init', 'success', '✅',
      `STK Push sent to ${phone}`,
      `${Number(amount).toLocaleString()} XAF via ${provider} — reference: ${result.data?.reference || '—'}`);

    /* Step 2: Confirmed */
    addStep('confirm', 'success', '🎉', 'Payment confirmed!',
      result.data?.message || result.data?.Message || 'Transaction completed successfully.');

    toast('success', `STK Push sent to ${phone}`, `${Number(amount).toLocaleString()} XAF — ${result.data?.reference}`);

    showResult(result.data);
    setLoading(false);
  }

  /* ── Live phone formatter hint ────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', () => {
      const v = phoneInput.value.replace(/\D/g, '');
      if (v && !v.startsWith('242')) {
        phoneInput.style.borderColor = 'var(--red)';
      } else {
        phoneInput.style.borderColor = '';
      }
    });
  });
</script>
</body>
</html>
